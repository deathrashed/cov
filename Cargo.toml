[package]
name = "cov"
version = "2.0.0"
edition = "2024"
description = "macOS integration toolkit for COV cover search (https://covers.musichoarders.xyz/)"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
walkdir = "2"
crossbeam = "0.8"
lofty = "0.22"
ratatui = { version = "0.30", features = ["serde"] }
crossterm = { version = "0.29", features = ["serde"] }
ratatui-image = "11"
image = "0.25"
nucleo = "0.5"
frizbee = "0.11"
id3 = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "matcher"
harness = false
