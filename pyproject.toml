[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riley-cov-toolkit-legacy"
version = "0.1.0"
description = "Legacy Python implementation of the COV integration toolkit. Superseded by the Rust rewrite in Cargo.toml."
requires-python = ">=3.12"
dependencies = [
  "mutagen>=1.47",
  "textual>=8,<9",
]

[project.scripts]
cov-tui-python = "lib.cov_tui:main"

[tool.ruff]
line-length = 110
target-version = "py312"
